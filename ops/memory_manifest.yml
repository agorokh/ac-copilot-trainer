# ----------------------------------------------------------------------------
# repo: per-repo classification data for hook_memory_gate.py (PR #194).
# Template propagation copies the gate code but NEVER overwrites this
# block. Adjust code_dirs to enumerate THIS repo's actual code directories
# so the gate gates real production code (not just template defaults).
# ----------------------------------------------------------------------------
repo:
  code_dirs:
    - "src"
    - "scripts"
    - "tests"
    - "ops"
    - "tools"
    - ".github/workflows"
    - ".github/actions"
    - "firmware"
  # This repo's canonical Tier-3 workspace (mirrors the CLAUDE.md auto-generated
  # block). resolve_workspace honors tier3_workspace_id BEFORE any name/vault_root
  # match, so it wins over the also-bridge-visible `ac_copilot_trainer` (#314).
  tier3_workspace_id: "ac_copilot"

manifest_version: 1
updated_at: "2026-06-23T07:10:00Z"
owner: "agorokh/ac-copilot-trainer"
anchors:
  # Placeholder anchors. Operator overlays replace these with real upstream
  # issue / ADR URLs in their .gitignored manifest. The schema does not
  # depend on these being reachable.
  umbrella_issue: "<your-orchestrator-repo>/issues/<umbrella-issue>"
  umbrella_adr: "<your-orchestrator-repo>/blob/main/docs/01_Vault/<Project>/01_Decisions/memory-fleet-observability.md"

# ---------------------------------------------------------------------------
# Schema v2 notes
# ---------------------------------------------------------------------------
# Two changes from v1, both backward-compatible for consumers that follow the
# defaults documented below:
#
#  - Per-workspace `backend: "lightrag" | "graphiti"` discriminator.
#    Consumers that encounter a workspace without `backend` MUST treat it as
#    "lightrag" (the canonical default). **New workspaces SHOULD default to
#    "lightrag" per docs/00_Core/MEMORY_SUBSTRATE.md** (the 2026-05-17 sunset
#    ADR reversed an earlier "graphiti canonical" direction; `graphiti` is
#    retained only for offline entity-resolution + bi-temporal metadata,
#    never on the agent read path).
#
#  - Per-workspace `origin: "repo-product" | "repo-embedded" | "human-curated"`
#    classification. Optional but recommended; see docs/00_Core/VAULT_TAXONOMY.md
#    for definitions and ingest-cadence implications.
#
# Canary-acceptance contract is now keyed by backend (different substrates
# return different response shapes). Consumers MUST look up
# `canary_acceptance[workspace.backend]`. A flat (un-nested) v1 form, if seen,
# is treated as `canary_acceptance.lightrag` for backward compatibility.
# ---------------------------------------------------------------------------

canary_acceptance:
  must_not_contain: "no relevant context found"
  must_match_regex: "^- \\[\\d+\\]"

# rms schedule guidance (mirrors propagation_manifest.yml cadence shape).
rms_scheduling:
  daily_job:
    cadence: "daily"
    command: "hermes run-skill memory-health-scan"
  weekly_job:
    cadence: "weekly"
    command: "hermes run-skill memory-health-scan --actuate"

# ---------------------------------------------------------------------------
# Real fleet for ac-copilot-trainer. Canonical Tier-3 workspace is `ac_copilot`
# on the central memory host `mac-mini-dev` (mirrors the CLAUDE.md auto-generated
# Tier-3 block). Endpoints are loopback on the central host; from a non-central
# host set AGENTIC_MEMORY_BRIDGE_HOST=mac-mini-dev so the bridge rewrites loopback
# to the Tailscale name (agent-factory/docs/00_Core/HOSTS.md). Contract:
# docs/00_Core/MEMORY_SUBSTRATE.md.
# ---------------------------------------------------------------------------
hosts:
  - id: "mac-mini-dev"
    owner_repo: "agorokh/ac-copilot-trainer"
    notes: "Central memory host. The ac_copilot workspace is one LightRAG endpoint with its own vault root and ingest-audit log."
    workspaces:
      - name: "ac_copilot"
        backend: "lightrag"
        origin: "repo-product"
        endpoint: "http://localhost:8045"
        vault_root: "docs/01_Vault/AcCopilotTrainer"
        audit_log: "docs/01_Vault/.turbovault/audit/operations.jsonl"
        launchd_label: "ai.lightrag.ingest-audit.ac_copilot"
        stale_after_hours: 24
        match_repo_basenames:
          - "ac-copilot-trainer"
        canary_queries:
          - prompt: "Assetto Corsa copilot training pipeline"
            mode: "mix"
          - prompt: "lap archive coaching telemetry"
            mode: "hybrid"
