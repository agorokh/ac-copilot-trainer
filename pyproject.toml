[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-copilot-trainer"
version = "0.1.0"
description = "AI-powered driving trainer for Assetto Corsa — CSP Lua app with brake point detection, lap comparison, 3D track markers, and real-time coaching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "bandit>=1.9.4",
  "detect-secrets>=1.5.0",
  "ruff>=0.15.11",
  "pre-commit>=4.5.1",
  "pyyaml>=6.0.3",
  # Security floor: keep pygments at 2.20.0+ because CVE-2026-4539 is fixed there (see #6).
  "pygments>=2.20.0",
  # Project-specific:
  "requests>=2.33.1",
  "websockets>=16.0",
  "lupa>=2.7",  # Lua runtime for HUD smoke tests (issue #66)
]
mining = [
  # Security floor: requests 2.33.0+ fixes CVE-2026-25645 (surfaced in pip-audit with dev+mining+knowledge).
  "requests>=2.33.1",
  "scikit-learn>=1.8.0",
  "numpy>=2.4.4",
]
mining-semantic = [
  # Opt-in for MINING_SEMANTIC_CLUSTER=1 — sentence-transformer embeddings + agglom clustering.
  # ~80 MB model download on first run (all-MiniLM-L6-v2). CPU-only on M2/M5 Pro.
  "sentence-transformers>=5.4.1",
  "scikit-learn>=1.8.0",
  "numpy>=2.4.4",
]
knowledge = [
    "mcp>=1.27.0",
]
bootstrap = [
    "copier>=9.14.3,<10",
]
coaching = [
    "websockets>=16.0",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "shap>=0.51.0",
]
# Issue #340: in-the-ear phrase-bank playback (lazy-imported in voice/playback.py).
# Install on the rig to render/play clips: pip install -e ".[voice]".
# numpy + sounddevice are the always-installable floor (bundled-PortAudio wheels that install
# cleanly on a clean Windows box). The lower-latency rtmixer backend is opt-in via the
# `voice-rtmixer` extra (#383) because it has no prebuilt Windows wheels; the voice engine
# auto-falls back to the sounddevice backend when rtmixer is not importable (PR #387), so this
# extra alone is enough to render and play clips.
voice = [
    "numpy>=2.4.4",
    "sounddevice>=0.5.1",
]
# Issue #383: OPT-IN, best-effort low-latency playback. rtmixer is the GIL-free C/PortAudio
# backend (`RtMixerPlayback`) but ships NO prebuilt Windows wheels and needs a C/PortAudio build
# toolchain, so it frequently HARD-FAILS `pip install` on a clean Windows rig. It is kept out of
# the default `voice`/`launcher` extras so those stay installable everywhere; install it only
# where pip can build it: `pip install -e ".[voice-rtmixer]"`. Pulls in the `voice` floor so this
# extra is sufficient on its own.
voice-rtmixer = [
    "ac-copilot-trainer[voice]",
    "rtmixer>=0.1.7",
]
# M0 (#341): Windows pyttsx3 voice client — no native audio stack required.
voice-client = [
    "pyttsx3>=2.90",
    "websockets>=16.0",
]
# Game Point launcher packaging (#363). Runtime code stays stdlib-only; this
# extra is needed to build the Windows .exe artifact and bundle sidecar runtime deps.
# Keep this extra ALWAYS-INSTALLABLE on a clean Windows rig: the sidecar voice floor here is
# numpy + sounddevice (bundled-PortAudio wheels). rtmixer is deliberately NOT bundled (#383) —
# it has no prebuilt Windows wheels and would hard-fail `pip install -e ".[launcher]"`; add the
# lower-latency backend opt-in and best-effort via `.[voice-rtmixer]` where a C toolchain exists.
launcher = [
  "pyinstaller>=6.15.0",
  "websockets>=16.0",
  "numpy>=2.4.4",
  "sounddevice>=0.5.1",
  "pyttsx3>=2.90",
]
# Issue #368: OFFLINE neural-voice bake (recommended Kokoro-82M backend, Apache-2.0). Used only by
# the rig/dev bake step (tools/ai_sidecar/voice/bake.py KokoroBackend, lazy-imported); never on the
# real-time hot path. ffmpeg (system) is also required for the prosody shaper. macOS dev can instead
# use the `say-expressive` backend (no extra deps).
voice-bake = [
    # kokoro-onnx 0.4.x currently declares Requires-Python <3.14; keep the extra installable on
    # this repo's advertised 3.14 dev/runtime while still enabling Kokoro where pip can solve it.
    "kokoro-onnx>=0.4.9; python_version < '3.14'",
    "soundfile>=0.13.1",
]
# Tier 3 Phase 2+ (#26): not installed in CI; see tools/model_training/train.py
training = [
  "torch>=2.11.0",
  "transformers>=5.5.4",
  "trl>=1.2.0",
  "peft>=0.19.1",
  "datasets>=4.8.4",
]
# Coaching lakehouse (EPIC #344 / #345): embedded DuckDB over the lap-archive corpus for
# whole-data-plane analytical queries (trends/dependencies across car x track x corner x
# condition x setup). Single pip wheel, no server -- Windows + py3.13 native.
analytics = [
  "duckdb>=1.4",
]
# Track Titan ingest CLI (#353): the `auth-check` / `export` network commands lazy-import
# `requests`. Install with `pip install -e ".[tt-ingest]"` to run the CLI outside a dev env.
tt-ingest = [
  "requests>=2.33.1",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ac_copilot_trainer*", "tools*"]

[tool.setuptools.package-data]
# Ship the native-OCR PowerShell helper so TrackTitanScreenOracle resolves it in wheel/non-editable installs.
"tools.ai_sidecar" = ["*.ps1"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Governance hooks under scripts/ are thin SHIMS into the fleet governance hub
# (reference-not-vendor, issue #338). Each is byte-identical to the hub's canonical shim — enforced
# by the conformance checker, NOT by style — and is hub-owned: the spoke does not own its formatting.
# Exclude them from the spoke's lint+format so style churn can never fight byte-identity conformance.
# force-exclude so the exclusion applies even when `make ci-fast` passes scripts/ explicitly.
force-exclude = true
extend-exclude = [
  "scripts/hook_session_start_memory_prefetch.py",
  "scripts/hook_memory_gate.py",
  "scripts/hook_protect_main_impl.py",
  "scripts/hook_memory_query_stamp.py",
  # Hub-owned helpers (byte-identical to hub; spoke does not own their formatting).
  "scripts/hook_repo_root.py",
  "scripts/hook_memory_manifest.py",
  # Gitignored local backups of pre-shim hook bodies kept during the #338 migration; not
  # repo-owned and never style-gated (ruff's force-exclude otherwise descends into the dotted dir
  # when scripts/ is passed explicitly).
  "scripts/.governance-vendored-bak/",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# ASYNC109: the headless test-harness client (issue #154 Part C) deliberately exposes a
# `timeout=` kwarg — `expect_coaching_response(timeout=...)` is the ergonomic API a test
# wants; the rule's suggested asyncio.timeout wrapper would force every caller to wrap
# each call for no real benefit. Internals still use asyncio.wait_for for the deadline.
"tools/ai_sidecar/harness_client.py" = ["ASYNC109"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/ac_copilot_trainer", "tools"]
omit = [
  "tools/process_miner/run.py",
  "tools/repo_knowledge/mcp_server.py",
  "tools/ai_sidecar/__main__.py",
  "tools/tt_ingest/__main__.py",
  # Display-bound launcher GUI + its screenshot dev harness: the testable
  # tone/palette/font logic lives in tools/rig_launcher/theme.py (100% covered);
  # the Tk render path needs a display, which headless CI cannot instantiate.
  "tools/rig_launcher/view.py",
  "tools/rig_launcher/preview.py",
]
