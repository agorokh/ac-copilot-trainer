<!-- @dsCard group="Colors" viewport="700x160" name="Brass & signal" subtitle="One house brass + three flat signal fields. Colour = state, vivid & matte, never glowing" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--carbon);font-family:var(--font-disp);color:var(--chalk);}
  .wrap{display:flex;gap:14px;margin:20px;flex-wrap:wrap;}
  .sw{width:150px;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .nm{font-weight:700;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;}
  .h{font-family:var(--font-mono);font-size:10px;opacity:0.7;margin-top:2px;}
  .use{font-family:var(--font-mono);font-size:9px;opacity:0.7;}
</style></head>
<body><div class="wrap">
  <div class="sw" style="background:#C8983E;color:#0B0C0D"><span class="nm">Brass</span><span class="use">house · structure</span><span class="h">#C8983E</span></div>
  <div class="sw" style="background:#2FBE6E;color:#06140c"><span class="nm">Clear</span><span class="use">on line · healthy</span><span class="h">#2FBE6E</span></div>
  <div class="sw" style="background:#F4A52C;color:#1c1404"><span class="nm">Lift</span><span class="use">caution · approaching</span><span class="h">#F4A52C</span></div>
  <div class="sw" style="background:#F23B2C;color:#fff"><span class="nm">Brake</span><span class="use">danger · too hot</span><span class="h">#F23B2C</span></div>
</div></body></html>
