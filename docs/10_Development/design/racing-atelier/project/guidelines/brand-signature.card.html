<!-- @dsCard group="Brand" viewport="700x220" name="Signature & motif" subtitle="Seg-mark atom · shift-light segments · machined corner bracket · the narrative order" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--carbon);color:var(--chalk);font-family:var(--font-disp);}
  .wrap{padding:24px;display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .cap{font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);}
  .seg{width:6px;height:24px;background:var(--brass);}
  .segbar{display:flex;gap:3px;width:160px;height:22px;}
  .segbar span{flex:1;}
  .frame{position:relative;width:130px;height:74px;background:var(--graphite);border:1px solid var(--edge);}
  .br{position:absolute;width:14px;height:14px;border:2px solid var(--brass);}
  .verb{font-weight:800;font-size:30px;text-transform:uppercase;color:var(--brake);line-height:0.8;}
</style></head>
<body><div class="wrap">
  <div class="col"><span class="cap">Seg-mark</span><div style="display:flex;gap:10px"><span class="seg"></span><span class="seg" style="background:var(--brake)"></span></div></div>
  <div class="col"><span class="cap">Shift-light segments</span>
    <div class="segbar"><span style="background:var(--chalk)"></span><span style="background:var(--chalk)"></span><span style="background:var(--chalk)"></span><span style="background:var(--chalk)"></span><span style="background:var(--lift)"></span><span style="background:var(--brake)"></span><span style="background:rgba(242,59,44,0.16)"></span><span style="background:var(--raise)"></span></div>
  </div>
  <div class="col"><span class="cap">Corner bracket frame</span>
    <div class="frame"><span class="br" style="top:-1px;left:-1px;border-right:0;border-bottom:0"></span><span class="br" style="bottom:-1px;right:-1px;border-left:0;border-top:0"></span></div>
  </div>
  <div class="col" style="gap:5px"><span class="cap">Narrative order</span>
    <span style="font-weight:600;font-size:10px;letter-spacing:0.08em;color:var(--brake)">▮ NOW ENTERING · T3-4</span>
    <span class="verb">Brake</span>
    <span style="font-family:var(--font-mono);font-size:10px;color:var(--mute);max-width:24ch">one decision · context recedes</span>
  </div>
</div></body></html>
