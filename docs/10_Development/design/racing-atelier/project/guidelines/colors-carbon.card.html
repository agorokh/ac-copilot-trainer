<!-- @dsCard group="Colors" viewport="700x150" name="Carbon ground" subtitle="Near-black surfaces — pixels off on OLED. Build up from black, never wash with grey" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--carbon);font-family:var(--font-disp);color:var(--chalk);}
  .wrap{display:flex;gap:1px;background:var(--line-2);border:1px solid var(--line-2);margin:20px;}
  .sw{flex:1;height:104px;background:var(--carbon);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .nm{font-weight:700;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:2px;}
</style></head>
<body><div class="wrap">
  <div class="sw" style="background:#0B0C0D"><span class="nm">Carbon</span><span class="h">#0B0C0D</span></div>
  <div class="sw" style="background:#141618"><span class="nm">Graphite</span><span class="h">#141618</span></div>
  <div class="sw" style="background:#191C1F"><span class="nm">Slab</span><span class="h">#191C1F</span></div>
  <div class="sw" style="background:#20242A"><span class="nm">Raise</span><span class="h">#20242A</span></div>
  <div class="sw" style="background:#2A2F35"><span class="nm">Edge</span><span class="h">#2A2F35</span></div>
</div></body></html>
