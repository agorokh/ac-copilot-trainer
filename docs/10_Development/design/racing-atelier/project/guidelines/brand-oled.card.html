<!-- @dsCard group="Brand" viewport="700x160" name="OLED true-black" subtitle="Every rig & dash on #000 — the pixel switched off. Deepest contrast, lowest draw" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:#000;font-family:var(--font-disp);color:var(--chalk);}
  .wrap{display:flex;gap:16px;padding:22px;align-items:center;flex-wrap:wrap;}
  .sw{width:140px;height:100px;border:1px solid var(--edge);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .nm{font-weight:700;font-size:12px;text-transform:uppercase;}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:2px;}
  .note{max-width:240px;font-family:var(--font-mono);font-size:11px;color:var(--mute);line-height:1.5;}
</style></head>
<body><div class="wrap">
  <div class="sw" style="background:#000"><span class="nm">OLED off</span><span class="h">#000000</span></div>
  <div class="sw" style="background:var(--carbon)"><span class="nm">Carbon</span><span class="h">#0B0C0D</span></div>
  <div class="sw" style="background:var(--graphite)"><span class="nm">Panel</span><span class="h">#141618</span></div>
  <div class="note">All-black rigs, dashboards and OLED screens. On OLED, #000 means the pixel is OFF — the deepest possible contrast and the lowest power. No glass, no blur on the rig: colour + segments only.</div>
</div></body></html>
