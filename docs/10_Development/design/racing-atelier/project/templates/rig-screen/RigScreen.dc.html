<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Rig render screen" description="Racing Atelier OLED rig — AC Copilot brake-zone, 320x480 true-black instrument cluster" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="min-height:560px;background:#0e0f11;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--font-read);">
  <div style="width:320px;height:480px;background:#000;border:1px solid var(--edge);border-radius:18px;padding:7px;box-shadow:var(--shadow-device);">
    <div style="width:100%;height:100%;background:var(--carbon);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;color:var(--chalk);">

      <div style="height:26px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:10px;color:var(--dim);flex:0 0 auto;">
        <span>SECTOR 2 · LAP 3</span>
        <span style="margin-left:auto;display:flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--clear);"></span><span style="font-family:var(--font-disp);font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--clear);">Live</span></span>
      </div>

      <div style="flex:1;padding:13px;display:flex;flex-direction:column;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line);">
          <span style="display:flex;align-items:baseline;gap:8px;"><span style="font-family:var(--font-disp);font-weight:700;font-size:13px;color:#000;background:var(--brass);padding:1px 5px;">T4</span><span style="font-family:var(--font-disp);font-weight:700;font-size:19px;letter-spacing:0.05em;text-transform:uppercase;">Ascari</span></span>
          <span style="font-family:var(--font-read);font-weight:700;font-size:21px;">196</span>
        </div>

        <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;">
          <div>
            <div style="font-family:var(--font-disp);font-weight:800;font-size:54px;line-height:0.82;letter-spacing:0.01em;text-transform:uppercase;color:var(--brake);">Brake</div>
            <div style="font-size:24px;line-height:0.6;color:var(--brake);">▼</div>
          </div>
          <div style="text-align:right;">
            <span style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">brake pt</span>
            <div><span style="font-family:var(--font-read);font-weight:700;font-size:44px;">86</span><span style="font-family:var(--font-mono);font-size:13px;color:var(--mute);">m</span></div>
          </div>
        </div>

        <div style="margin-top:14px;">
          <x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.SegmentBar" fill="0.66" zone="0.34" height="22px" hint-size="100%,22px">brake zone</x-import>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;">
          <span style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">now</span>
          <span style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brake);">brake zone</span>
        </div>

        <div style="margin-top:18px;">
          <span style="font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mute);">entry Δ · ref 182</span>
          <div style="margin-top:8px;"><x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.DeltaBar" value="14" ref-label="182" hint-size="100%,50px">entry delta</x-import></div>
        </div>

        <div style="margin-top:auto;display:flex;gap:8px;align-items:baseline;">
          <span style="font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brake);">−0.18s</span>
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--mute);">lost here · trail to apex</span>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:7px;padding:8px 12px;border-top:1px solid var(--line);flex:0 0 auto;">
        <span style="width:4px;height:12px;background:var(--brass);"></span>
        <span style="font-family:var(--font-disp);font-weight:700;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--dim);">AC Copilot</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
