<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="In-game HUD" description="Racing Atelier coaching widget — the brake-zone instrument over the track" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="position:relative;width:100%;min-height:560px;background:#08090a;font-family:var(--font-read);overflow:hidden;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,#3a4048 0%,#2a2e33 30%,#1a1c20 52%,#0e0f11 100%);"></div>

  <div style="position:relative;display:flex;justify-content:center;padding-top:54px;">
    <div style="position:relative;width:560px;background:var(--glass-fill);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);box-shadow:var(--shadow-glass);padding:22px 26px;">
      <span style="position:absolute;top:-1px;left:-1px;width:14px;height:14px;border:2px solid var(--brass);border-right:0;border-bottom:0;"></span>
      <span style="position:absolute;top:-1px;right:-1px;width:14px;height:14px;border:2px solid var(--brass);border-left:0;border-bottom:0;"></span>
      <span style="position:absolute;bottom:-1px;left:-1px;width:14px;height:14px;border:2px solid var(--brass);border-right:0;border-top:0;"></span>
      <span style="position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border:2px solid var(--brass);border-left:0;border-top:0;"></span>

      <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);">
        <span style="display:flex;align-items:baseline;gap:9px;">
          <span style="font-family:var(--font-disp);font-weight:700;font-size:14px;color:#000;background:var(--brass);padding:1px 6px;">T4</span>
          <span style="font-family:var(--font-disp);font-weight:700;font-size:22px;letter-spacing:0.05em;text-transform:uppercase;color:var(--chalk);">Ascari</span>
        </span>
        <span style="display:flex;gap:16px;">
          <span><span style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">gear</span><div style="font-family:var(--font-read);font-weight:700;font-size:24px;color:var(--chalk);">2</div></span>
          <span><span style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">km/h</span><div style="font-family:var(--font-read);font-weight:700;font-size:24px;color:var(--chalk);">196</div></span>
        </span>
      </div>

      <div style="display:flex;align-items:center;gap:20px;margin-top:18px;">
        <div style="width:188px;">
          <x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.CommandVerb" tone="stop" arrow="down" hint-size="188px,80px">Brake</x-import>
        </div>
        <div style="flex:1;text-align:right;">
          <span style="font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">brake point</span>
          <div><span style="font-family:var(--font-read);font-weight:700;font-size:58px;color:var(--chalk);">86</span><span style="font-family:var(--font-mono);font-size:15px;color:var(--mute);">m</span></div>
        </div>
      </div>

      <div style="margin-top:16px;">
        <x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.SegmentBar" fill="0.66" zone="0.34" hint-size="100%,26px">brake zone</x-import>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:7px;">
        <span style="font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">now</span>
        <span style="font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brake);">brake zone</span>
      </div>

      <div style="margin-top:22px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
          <span style="font-family:var(--font-disp);font-weight:600;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mute);">entry Δ · ref 182 km/h</span>
          <span style="font-family:var(--font-disp);font-weight:600;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brake);">too hot — lift</span>
        </div>
        <x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.DeltaBar" value="14" ref-label="182 km/h" hint-size="100%,50px">entry delta</x-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
