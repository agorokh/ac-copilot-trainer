<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Track Atlas" description="Racing Atelier in-game track description — circuit, you-are-here, pace note, elevation (Spa)" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="position:relative;width:100%;min-height:520px;background:#08090a;font-family:var(--font-read);overflow:hidden;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,#3a4048 0%,#23272c 34%,#0e0f11 100%);"></div>

  <div style="position:relative;display:flex;justify-content:center;padding-top:48px;">
    <div style="position:relative;width:680px;background:var(--glass-fill);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);box-shadow:var(--shadow-glass);padding:22px 26px;">
      <span style="position:absolute;top:-1px;left:-1px;width:14px;height:14px;border:2px solid var(--brass);border-right:0;border-bottom:0;"></span>
      <span style="position:absolute;top:-1px;right:-1px;width:14px;height:14px;border:2px solid var(--brass);border-left:0;border-bottom:0;"></span>
      <span style="position:absolute;bottom:-1px;left:-1px;width:14px;height:14px;border:2px solid var(--brass);border-right:0;border-top:0;"></span>
      <span style="position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border:2px solid var(--brass);border-left:0;border-top:0;"></span>

      <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);">
        <span style="display:flex;align-items:center;gap:12px;"><span style="width:6px;height:18px;background:var(--brass);"></span><span style="font-family:var(--font-disp);font-weight:800;font-size:20px;letter-spacing:0.05em;text-transform:uppercase;color:var(--chalk);">Spa-Francorchamps</span></span>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--mute);">7.004 km · 19 corners · 102 m climb · 2 DRS</span>
      </div>

      <div style="display:flex;gap:26px;margin-top:18px;">
        <div style="flex:1.3;">
          <div style="font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;">circuit · you are here</div>
          <x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.TrackMap"
            path="M46 150 L46 110 Q46 98 58 98 L176 88 Q194 87 198 70 L220 24 Q225 12 238 14 Q251 16 248 30 L233 80 Q230 96 245 100 L292 116 Q306 120 304 134 Q302 148 288 146 L176 136 Q140 134 128 146 Q116 158 98 156 L60 154 Q46 153 46 150 Z"
            view-box="0 0 340 170" highlight="M198 70 L220 24 Q225 12 238 14" opacity="0.5"
            here="{{ here }}" labels="{{ labels }}" hint-size="100%,180px">circuit map</x-import>
          <div style="font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px;">elevation · the climb</div>
          <x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.ElevationProfile"
            points="0,46 70,44 120,40 150,12 180,16 240,30 320,34" peak-x="150" peak-label="+38 m" start-label="la source" end-label="kemmel" hint-size="100%,56px">elevation</x-import>
        </div>
        <div style="flex:1;border-left:1px solid var(--line);padding-left:24px;">
          <x-import component-from-global-scope="ACCopilotDesignSystem_bba7a8.CornerNote"
            id="T3-4" name="Raidillon" gear="6" min-speed="285" throttle="100"
            note="flat-out uphill left-right. commit on the entry, the crest goes blind — aim for the right kerb on exit. don't lift or you lose Kemmel." hint-size="100%,200px">corner note</x-import>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;">
        <span style="align-self:center;font-family:var(--font-disp);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">next</span>
        <div style="flex:1;display:flex;gap:8px;">
          <div style="flex:1;background:var(--raise);padding:8px 10px;"><div style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--lift);">T5 · 480 m</div><div style="font-family:var(--font-disp);font-weight:700;font-size:12px;text-transform:uppercase;color:var(--chalk);margin-top:2px;">Les Combes</div><div style="font-family:var(--font-mono);font-size:9px;color:var(--dim);">brake · 4th</div></div>
          <div style="flex:1;background:var(--raise);padding:8px 10px;"><div style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mute);">T8 · 1.1 km</div><div style="font-family:var(--font-disp);font-weight:700;font-size:12px;text-transform:uppercase;color:var(--chalk);margin-top:2px;">Rivage</div><div style="font-family:var(--font-mono);font-size:9px;color:var(--dim);">hairpin · 2nd</div></div>
          <div style="flex:1;background:var(--raise);padding:8px 10px;"><div style="font-family:var(--font-disp);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mute);">T10 · 1.6 km</div><div style="font-family:var(--font-disp);font-weight:700;font-size:12px;text-transform:uppercase;color:var(--chalk);margin-top:2px;">Pouhon</div><div style="font-family:var(--font-mono);font-size:9px;color:var(--dim);">fast-L · 5th</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      here: { x: 198, y: 70 },
      labels: [{ x: 120, y: 58, text: "eau rouge / raidillon", tone: "stop", size: 9 }],
    };
  }
}
</script>
</body>
</html>
