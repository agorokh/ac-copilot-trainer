name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLEET_GOVERNANCE_ROOT: ${{ github.workspace }}/.fleet-governance
    steps:
      - name: Reject PRs whose head branch is main
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "main" ]; then
            echo "Do not open pull requests from the main branch; use a feature branch."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify GH_PAT for governance-hub checkout
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT is not configured — cannot checkout private governance-hub runtime."
            exit 1
          fi

      - name: Checkout governance-hub runtime
        uses: actions/checkout@v6
        with:
          repository: agorokh/governance-hub
          ref: main
          path: .fleet-governance
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mining,knowledge]"

      - name: make ci-fast
        run: make ci-fast
