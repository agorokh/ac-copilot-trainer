name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Egress runtime is VENDORED in-repo (.fleet-governance-vendor) — no private-hub checkout, no
      # GH_PAT. The vendored client is hostname-clean and SHA-256-pinned to the hub
      # (tests/test_vendored_egress_pin.py). See governance-hub#75 / #78.
      FLEET_GOVERNANCE_ROOT: ${{ github.workspace }}/.fleet-governance-vendor
    steps:
      - name: Reject PRs whose head branch is main
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "main" ]; then
            echo "Do not open pull requests from the main branch; use a feature branch."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mining,knowledge,analytics]"

      - name: make ci-fast
        run: make ci-fast
