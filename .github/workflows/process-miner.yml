name: Weekly Process Miner

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days
        default: "30"

# GitHub REST check-runs endpoint requires checks: read (see collect_pr_data / get_pr_check_runs).
# Keep checks: read in this block — omitting it silently drops CI rollup data (no check_runs).
permissions:
  checks: read
  contents: write
  pull-requests: write
  issues: read

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (PR creation)
        # Short-lived installation token from fleet-automation-bot; replaces the
        # static GH_PAT (projected per-repo from Doppler). governance-hub#76.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mining,knowledge]"

      - name: Bootstrap knowledge from canonical docs
        run: make bootstrap-knowledge

      - name: Run process miner
        id: mine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DAYS_INPUT: ${{ github.event.inputs.days }}
        run: |
          if [ -z "$DAYS_INPUT" ]; then DAYS=30; else DAYS="$DAYS_INPUT"; fi
          python scripts/process_miner.py \
            --repo "$REPO" \
            --days "$DAYS" \
            --emit-learned \
            --ingest-knowledge \
            --max-prs 40

      - name: Zero learned rules warning
        if: steps.mine.outputs.learned_artifact_files_count == '0'
        run: |
          echo "::warning::Process miner wrote 0 new learned artifact files this run (stricter clustering or sparse review data)."

      - name: Upload process-miner audit sidecar
        if: always()
        # Audit telemetry must never gate rules delivery: a transient upload-artifact
        # failure (quota, network) would otherwise skip commit/push/PR (review, gov-hub#289).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: process-miner-audit-${{ github.run_id }}
          path: reports/process_miner
          if-no-files-found: warn
          retention-days: 30

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Open PR with learned rules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is not available from the fleet GitHub App token step -- cannot open a PR (default GITHUB_TOKEN is blocked by policy). Check FLEET_BOT_APP_ID/FLEET_BOT_APP_PRIVATE_KEY secrets and app permissions."
            exit 1
          fi
          BRANCH="chore/miner-weekly-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          # Rules-only, add-only staging (epic gov-hub#197: scope_pure_for_pr). The miner may
          # still touch AGENTS.md / reports/process_miner in the runner workspace: reports are
          # preserved as a workflow artifact above; AGENTS.md deltas are intentionally not
          # emitted (the learned-rules mirrors are the sole rules channel).
          git add -- ':(glob).claude/rules/learned/**/*.md' || true
          git add -- ':(glob).cursor/rules/learned/**/*.mdc' || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          scripts/process_miner_pr_scope.sh
          git commit -m "chore: weekly process miner — learned rules"
          git push --set-upstream origin "$BRANCH"
          if gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: weekly miner rules" \
            --body "Auto-generated from process miner. Refs #14. Review learned rules before merging."; then
            echo "Opened PR for $BRANCH."
          else
            echo "::error::Could not open a PR for $BRANCH; deleting the orphan branch so it does not accumulate."
            git push origin --delete "$BRANCH" || true
            exit 1
          fi
