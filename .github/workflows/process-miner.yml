name: Weekly Process Miner

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days
        default: "30"

# GitHub REST check-runs endpoint requires checks: read (see collect_pr_data / get_pr_check_runs).
# Keep checks: read in this block — omitting it silently drops CI rollup data (no check_runs).
permissions:
  checks: read
  contents: write
  pull-requests: write
  issues: read

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (PR creation)
        # Short-lived installation token from fleet-automation-bot; replaces the
        # static GH_PAT (projected per-repo from Doppler). governance-hub#76.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mining,knowledge]"

      - name: Bootstrap knowledge from canonical docs
        run: make bootstrap-knowledge

      # gov-hub#266 + public-spoke resolution: cannot uses: private hub action cross-repo.
      # Checkout hub at pin with fleet-bot token, run local-path composite (same pattern as
      # steward-miner-rules, gov-hub#289 Change C).
      - name: Mint fleet-bot token (read governance-hub for process-miner)
        id: hub-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: governance-hub
      - name: Check out pinned governance-hub process-miner action
        uses: actions/checkout@v7
        with:
          repository: agorokh/governance-hub
          ref: 7bab94b1618dd5f62d3ab0b17e596efc5a00263b  # pragma: allowlist secret (git SHA, not a secret)
          token: ${{ steps.hub-token.outputs.token }}
          path: .governance-hub
      - name: Run process miner
        id: mine
        uses: ./.governance-hub/.github/actions/process-miner
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          days: ${{ github.event.inputs.days || '30' }}
          max-prs: "40"
          emit-learned: "true"
          no-agents-md: "true"
          ingest-knowledge: "true"
          distill: "false"
          install-deps: "false"

      - name: Verify hub producer contract
        if: success()
        env:
          HUB_ROOT: ${{ steps.mine.outputs.hub-root }}
          LEARNED_COUNT: ${{ steps.mine.outputs.learned_artifact_files_count }}
        run: |
          set -euo pipefail
          if [[ -z "${HUB_ROOT}" ]]; then
            echo "::error::process-miner action did not emit hub-root (action failed to resolve)"
            exit 1
          fi
          if [[ "${HUB_ROOT}" != /* ]]; then
            echo "::error::hub-root '${HUB_ROOT}' is not an absolute path"
            exit 1
          fi
          # NOTE: hub layout is deliberately NOT re-asserted here. `process-miner/action.yml`
          # emits `hub-root` at exactly one site, and only after it has itself verified
          # `scripts/process_miner.py` + the top-level `process_miner/` package; if it cannot,
          # it exits 1 and this output is empty, which the non-empty check above catches.
          # A second copy of that layout carries no independent signal and only drifts —
          # it is what left four spokes RED for 13 days (gov-hub#461, gov-hub#305).
          if [[ ! "${LEARNED_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::learned_artifact_files_count is not an integer (got '${LEARNED_COUNT}')"
            exit 1
          fi
          echo "Hub producer OK: hub-root=${HUB_ROOT} learned_artifact_files_count=${LEARNED_COUNT}"

      - name: Restore spoke vendored miner tree
        # Ephemeral hub overlay is torn down by the action; restore tracked vendored tree
        # for local scripts/tests that still import tools.process_miner (gov-hub#266 residual).
        if: always()
        run: |
          set -euo pipefail
          if ! git restore --source=HEAD --worktree -- tools/process_miner scripts/process_miner.py 2>/dev/null; then
            git checkout -- tools/process_miner scripts/process_miner.py 2>/dev/null || true
          fi
          git clean -fd -- tools/process_miner 2>/dev/null || true
          echo "Spoke vendored miner tree restored (best-effort)."

      - name: Zero learned rules warning
        if: steps.mine.outputs.learned_artifact_files_count == '0'
        run: |
          echo "::warning::Process miner wrote 0 new learned artifact files this run (stricter clustering or sparse review data)."

      - name: Upload process-miner audit sidecar
        if: always()
        # Audit telemetry must never gate rules delivery: a transient upload-artifact
        # failure (quota, network) would otherwise skip commit/push/PR (review, gov-hub#289).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: process-miner-audit-${{ github.run_id }}
          path: reports/process_miner
          if-no-files-found: warn
          retention-days: 30

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Open PR with learned rules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is not available from the fleet GitHub App token step -- cannot open a PR (default GITHUB_TOKEN is blocked by policy). Check FLEET_BOT_APP_ID/FLEET_BOT_APP_PRIVATE_KEY secrets and app permissions."
            exit 1
          fi
          BRANCH="chore/miner-weekly-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          # Rules-only, add-only staging (epic gov-hub#197: scope_pure_for_pr). Reports are
          # preserved as a workflow artifact above; the learned-rules mirrors are the sole
          # writable rules channel (gov-hub#290).
          git add -- ':(glob).claude/rules/learned/**/*.md' || true
          git add -- ':(glob).cursor/rules/learned/**/*.mdc' || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          scripts/process_miner_pr_scope.sh
          git commit -m "chore: weekly process miner — learned rules"
          git push --set-upstream origin "$BRANCH"
          if gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: weekly miner rules" \
            --body "Auto-generated from process miner. Refs #14. Review learned rules before merging."; then
            echo "Opened PR for $BRANCH."
          else
            echo "::error::Could not open a PR for $BRANCH; deleting the orphan branch so it does not accumulate."
            git push origin --delete "$BRANCH" || true
            exit 1
          fi
