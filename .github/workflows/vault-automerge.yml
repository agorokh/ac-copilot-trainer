name: Vault auto-merge

# Thin caller. The vault-only scope guard (`docs/01_Vault/**` only) + the head-bound SYNCHRONOUS
# merge (gov-hub#187/#190 -- never native `--auto`, so no standing server-side order can fire on
# a stale head and orphan a follow-up commit) live ONCE in the governance-hub `vault-automerge`
# composite action (agent-factory#863, gov-hub#122/#123), instead of a per-repo vendored copy.
# This repo keeps only the trigger, the `vault-only` label gate, and permissions; the action
# operates on the PR via `gh` (no checkout). SHA-pinned (reference-not-vendor; roll canary -> fleet).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Re-evaluate when the review round settles (#901, template-repo#592). The pull_request run fires
  # seconds after a push, while the self-hosted reviewer daemon still holds that head's review
  # lease, and the hub action refuses `lease_in_flight` (gov-hub#464, correct). No further
  # pull_request event follows, so without this trigger the PR waits for the hub vault-pr-sweep
  # or a manual rerun (#886). The daemon posts its review and flips the lease terminal 2-3 s later;
  # this run reaches the review-round snapshot ~10 s after the event, so it sees the settled round.
  # A miss (a slower release) refuses again and the sweep stays the backstop. The payload carries
  # `pull_request`, so the job gate, concurrency group and `pr-number` below are unchanged.
  pull_request_review:
    types: [submitted]

# A label-at-create PR (`gh pr create --label vault-only`) fires both `opened`
# and `labeled`. Serialize per PR so duplicate runs do not race each other; do
# not cancel, because each run should finish with a real success/failure result
# (template-repo#238 — a cancelled run throws away one of the few 300s merge
# windows the event dispatched).
concurrency:
  group: vault-automerge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  guard-and-automerge:
    if: contains(github.event.pull_request.labels.*.name, 'vault-only') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # The composite action lives in the PRIVATE governance-hub repo. A cross-repo `uses:` of a
      # private action does NOT resolve with the default GITHUB_TOKEN ("Unable to resolve action
      # agorokh/governance-hub, not found" — issue #329), so mint the fleet-bot app token, check the
      # action out at its pinned SHA, and run it via a local path. Reference-not-vendor is preserved:
      # the logic still lives ONCE in the hub at this SHA; we only change HOW it is fetched.
      - name: Mint fleet-bot token (read governance-hub)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: governance-hub
      # Canonical bound-checkout shape (#889). The hub vault-pr-sweep (gov-hub#343) re-runs this
      # same action for a vault PR whose event-driven run was refused (e.g. `lease_in_flight`
      # while the reviewer daemon still held the head). Its discover step admits a LOCAL hub
      # action only when the IMMEDIATELY preceding step is this checkout: `path:` is
      # `.scratch/governance-hub-<sha>` with the same <sha> as `ref:` and as the `uses:` below,
      # `persist-credentials: false`, and a `token:`/`ssh-key:` (hub
      # scripts/vault_sweep_discover.py::_bound_local_action). Any other shape is skipped as
      # `caller-unreadable` every cycle, and the PR waits for a manual `vault-only` label toggle.
      # Keep the three SHA occurrences identical when rolling the pin.
      - name: Check out the pinned governance-hub vault-automerge action
        uses: actions/checkout@v7
        with:
          repository: agorokh/governance-hub
          ref: 77fd08162a73dd6d11af521e8d17792b28095d58  # pragma: allowlist secret (git SHA, not a secret)
          token: ${{ steps.app-token.outputs.token }}
          path: .scratch/governance-hub-77fd08162a73dd6d11af521e8d17792b28095d58
          persist-credentials: false
      - uses: ./.scratch/governance-hub-77fd08162a73dd6d11af521e8d17792b28095d58/.github/actions/vault-automerge
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          handoff-lane: "true"
          # Do not hold a runner while required checks finish (workstation-ops#3632). The first
          # "required checks are pending" answer ends this step green with the PR still open, and
          # the hub vault-pr-sweep merges it once it is mergeable. A PR that then never merges is
          # listed in the hub issue "Vault sweep: vault-only PRs open past the stall limit".
          release-when-pending: "true"
