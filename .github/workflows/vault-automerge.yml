name: Vault auto-merge

# Thin caller. The vault-only scope guard (`docs/01_Vault/**` only) + the head-bound SYNCHRONOUS
# merge (gov-hub#187/#190 -- never native `--auto`, so no standing server-side order can fire on
# a stale head and orphan a follow-up commit) live ONCE in the governance-hub `vault-automerge`
# composite action (agent-factory#863, gov-hub#122/#123), instead of a per-repo vendored copy.
# This repo keeps only the trigger, the `vault-only` label gate, and permissions; the action
# operates on the PR via `gh` (no checkout). SHA-pinned (reference-not-vendor; roll canary -> fleet).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A label-at-create PR (`gh pr create --label vault-only`) fires both `opened`
# and `labeled`. Serialize per PR so duplicate runs do not race each other; do
# not cancel, because each run should finish with a real success/failure result
# (template-repo#238 — a cancelled run throws away one of the few 300s merge
# windows the event dispatched).
concurrency:
  group: vault-automerge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  guard-and-automerge:
    if: contains(github.event.pull_request.labels.*.name, 'vault-only') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # The composite action lives in the PRIVATE governance-hub repo. A cross-repo `uses:` of a
      # private action does NOT resolve with the default GITHUB_TOKEN ("Unable to resolve action
      # agorokh/governance-hub, not found" — issue #329), so mint the fleet-bot app token, check the
      # action out at its pinned SHA, and run it via a local path. Reference-not-vendor is preserved:
      # the logic still lives ONCE in the hub at this SHA; we only change HOW it is fetched.
      - name: Mint fleet-bot token (read governance-hub)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: governance-hub
      - name: Check out the pinned governance-hub vault-automerge action
        uses: actions/checkout@v7
        with:
          repository: agorokh/governance-hub
          ref: f5d9a873dfe1a0893ecc6d2b77935ca27a2c2d0f  # pragma: allowlist secret (git SHA, not a secret)
          token: ${{ steps.app-token.outputs.token }}
          path: .governance-hub
      - uses: ./.governance-hub/.github/actions/vault-automerge
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
