name: Security

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e ".[dev,mining,knowledge]" pip-audit

      # pip 26.0.1 (bundled on the GHA runner): CVE-2026-3219 — no fix version published yet.
      # Ignored here because the vulnerability is in the installer itself, not a project dependency;
      # revisit when a fixed pip is released and remove the --ignore-vuln flag.
      # PYSEC-2024-277 (joblib via scikit-learn) and PYSEC-2025-183 (PyJWT via mcp): supplier-disputed,
      # no fix version on PyPI; tracked until upstream publishes a patched release.
      - name: Run pip-audit
        run: >-
          pip-audit
          --ignore-vuln CVE-2026-3219
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2025-183
